<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <title>Accessible Photo Gallery</title>
     <link rel="stylesheet" href="css/gallery.css">
</head>

<body onload="initGallery()">
     <h1>My Accessible Image Gallery</h1>

     <div id="image">
          <span id="caption">Hover over an image below to display here.</span>
     </div>

     <div class="thumbnails">
          <img src="images/Peach.jpg" alt="Peach flower"
               onmouseover="upDate(this)" onmouseout="undo()"
               onfocus="upDate(this)" onblur="undo()">
          <img src="images/Rose.jpg" alt="Rose flower"
               onmouseover="upDate(this)" onmouseout="undo()"
               onfocus="upDate(this)" onblur="undo()">
          <img src="images/HoaNhai.jpg" alt="Jasmine flower"
               onmouseover="upDate(this)" onmouseout="undo()"
               onfocus="upDate(this)" onblur="undo()">
          <img src="images/Tulip.jpg" alt="Tulip flower"
               onmouseover="upDate(this)" onmouseout="undo()"
               onfocus="upDate(this)" onblur="undo()">
          <img src="images/Lotus.jpg" alt="Lotus flower"
               onmouseover="upDate(this)" onmouseout="undo()"
               onfocus="upDate(this)" onblur="undo()">
          <img src="images/Sunflower.jpg" alt="Sunflower"
               onmouseover="upDate(this)" onmouseout="undo()"
               onfocus="upDate(this)" onblur="undo()">
     </div>

     <script src="js/gallery.js"></script>
</body>

</html>
